<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180x180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png" />
    <link rel="icon" type="image/svg+xml" href="/assets/svg/minios_icon.svg" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#38AEEB" />

    <title>MiniOS - Fast. Simple. Reliable.</title>
    <style>
      html,body{margin:0;min-height:100%;background:#0f1115}
      #root{min-height:100vh}
      .app-loader{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at top,rgba(56,174,235,.18),transparent 45%),#0f1115;color:#f8fafc;z-index:9999}
      .app-loader__content{display:flex;flex-direction:column;align-items:center;gap:14px;font:500 14px/1.4 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}
      .app-loader__spinner{width:44px;height:44px;border:2px solid rgba(255,255,255,.14);border-top-color:#38aeeb;border-radius:999px;animation:app-loader-spin .9s linear infinite;box-shadow:0 0 24px rgba(56,174,235,.18)}
      html.js-app-loading .app-loader{display:flex}
      html.js-app-loading [data-seo-shell]{display:none!important}
      html.app-ready .app-loader{display:none}
      @keyframes app-loader-spin{to{transform:rotate(360deg)}}
    </style>
    <script>
      (() => {
        const root = document.documentElement
        root.classList.add('js-app-loading')
      })()
    </script>
  </head>
  <body>
    <div class="app-loader" aria-hidden="true">
      <div class="app-loader__content">
        <div class="app-loader__spinner"></div>
        <div>Loading MiniOS</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
